[package]
name = "groundsplit"
version = "0.1.0"
edition = "2024"
description = "Tiny command-line tool for creating and rendering graphics similar to what LiveSplit would output."
license = "GPL-3.0-only"

default-run = "groundsplit"

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
ffmpeg-sidecar = { version = "2.5", default-features = false }
piet-common = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
